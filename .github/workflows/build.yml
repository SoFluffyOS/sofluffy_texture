name: Build

# Run by hand: Actions > Build > Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libegl1-mesa-dev libgles2-mesa-dev libgbm-dev

      - name: Analyze and test
        if: matrix.target == 'linux'
        run: |
          flutter pub get
          dart format --set-exit-if-changed lib test example/lib example/integration_test example/packages/texture_demo/lib
          flutter analyze
          flutter test

      - name: Build the example
        working-directory: example
        run: flutter build ${{ matrix.target }} --debug

      - name: Draw real buffers through the texture
        if: matrix.target == 'macos'
        working-directory: example
        run: flutter test integration_test -d macos
