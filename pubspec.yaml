name: sofluffy_texture
description: Hands GPU buffers that native code already holds to Flutter as textures, without a copy, on macOS, Windows and Linux.
version: 0.1.0
homepage: https://github.com/SoFluffyOS/sofluffy_texture
repository: https://github.com/SoFluffyOS/sofluffy_texture
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: SofluffyTexturePlugin
      macos:
        pluginClass: SofluffyTexturePlugin
      windows:
        pluginClass: SofluffyTexturePlugin
